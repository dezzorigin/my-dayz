name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (0 error; warnings ditoleransi, lihat README)
        run: npm run lint

      - name: Build (static export + worker)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Worker ikut ter-copy ke out/
        run: test -s out/_worker.js && grep -q "api/chat" out/_worker.js

      - name: Upload static output
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/

  # Gate keamanan dependensi produksi (pengganti `npm audit --omit=dev`).
  # `npm audit --omit=dev` tetap melaporkan advisory yang hanya reachable
  # lewat dev deps (bug npm yang diketahui), sehingga job audit lama gagal
  # deterministik pada temuan HIGH dev-only padahal pohon produksi bersih.
  # Sweep ini memakai sumber data yang sama (GitHub Advisory Database,
  # dipakai Dependabot) tapi hanya memeriksa dependensi produksi, dan
  # tetap FAIL kalau ada temuan high/critical di prod.
  #
  # CATATAN KLASIFIKASI (pelajaran repo #22): `shadcn` (CLI) HARUS tetap di
  # devDependencies — ia pernah duduk di dependencies dan menyeret seluruh
  # pohonnya ke klasifikasi produksi (57 temuan HIGH/CRITICAL). Di repo ini
  # tidak ada CLI scaffolding di dependencies; yang dicek sweep adalah
  # Next.js 16.4.6 + React 19 + Zustand + xyflow + Recharts + Supabase-js.
  # Dependensi yang ditambal via `overrides` di package.json (temuan
  # HIGH/CRITICAL transitif, 18 Nov 2026): postcss, dompurify
  # (via html2pdf.js), nanoid (via postcss), sharp (via next),
  # source-map-js (via Tailwind).
  advisory-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Advisory sweep (production, high and above)
        run: python3 scripts/advisory-sweep.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Smoke test end-to-end lokal: sajikan out/ + worker, lalu curl.
  # Beda dari repo Next sebelumnya (lighthouse / kontrak SSE / kontrak
  # ringkasan): di sini yang diuji adalah KONTRAK CHAT + MODE DEMO —
  # /api/status mode unconfigured, POST /api/chat tanpa kunci menjawab 503
  # AI_KEY_REQUIRED (bukan pura-pura menjawab), dan SEMUA rute aplikasi
  # menyajikan HTML (landing berisi hero + link GitHub + preview produk).
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export + worker)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Serve + smoke test
        run: |
          set -euo pipefail
          (PORT=8332 npm run serve > /tmp/mydayz-serve.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8332/api/status >/dev/null 2>&1 && break
            sleep 1
          done
          # Landing: hero + navbar GitHub + preview produk di HTML statis
          curl -fsS http://127.0.0.1:8332/ | grep -q "Masuk Sekarang" \
            && echo "landing: hero OK"
          curl -fsS http://127.0.0.1:8332/ | grep -q "github.com/dezzorigin/my-dayz" \
            && echo "landing: link GitHub OK"
          curl -fsS http://127.0.0.1:8332/ | grep -q "preview-dashboard.png" \
            && echo "landing: preview produk OK"
          # Login: tombol demo ada
          curl -fsS http://127.0.0.1:8332/login | grep -q "Masuk sebagai demo" \
            && echo "login: tombol demo OK"
          # Semua rute aplikasi menyajikan HTML 200
          for r in dashboard planner habits finance diary calendar roadmap ai settings; do
            curl -fsS -o /dev/null "http://127.0.0.1:8332/$r" && echo "route /$r: 200 OK"
          done
          # Aset PWA: manifest + ikon tidak 404 (pernah hilang dari repo)
          curl -fsS -o /dev/null http://127.0.0.1:8332/manifest.json && echo "manifest: 200 OK"
          curl -fsS -o /dev/null http://127.0.0.1:8332/favicon.ico && echo "favicon: 200 OK"
          curl -fsS -o /dev/null http://127.0.0.1:8332/icon.svg && echo "icon.svg: 200 OK"
          # Worker: status mode unconfigured (tanpa GEMINI_API_KEY)
          curl -fsS http://127.0.0.1:8332/api/status | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['ok'] is True and d['mode'] == 'unconfigured' and d['engine'] == 'gemini', d
          print('status: mode unconfigured OK')
          "
          # JANGAN pakai -f di sini: curl -f menelan output -w saat error
          # (exit 22 tanpa body), sehingga grep tidak pernah cocok.
          # Bandingkan kode status secara eksplisit.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8332/api/chat \
            -H 'content-type: application/json' -d '{}')
          [ "$code" = "400" ] || (echo "POST kosong harus 400, dapat $code" && exit 1)
          echo "POST kosong: 400 OK"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8332/api/chat \
            -H 'content-type: application/json' -d '{"message":"halo"}')
          [ "$code" = "503" ] || (echo "POST tanpa kunci harus 503, dapat $code" && exit 1)
          curl -s -X POST http://127.0.0.1:8332/api/chat \
            -H 'content-type: application/json' -d '{"message":"halo"}' | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d.get('code') == 'AI_KEY_REQUIRED', d
          print('chat tanpa kunci: 503 AI_KEY_REQUIRED OK')
          "

  # Dokumen wajib ada + diagram SVG benar-benar SVG (bukan placeholder).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docs
        run: |
          set -euo pipefail
          for f in README.md PRD.md CHANGELOG.md docs/README.md docs/ARCHITECTURE.md docs/COMPONENTS.md docs/SCHEMA.md \
              docs/SECURITY.md docs/DEPLOYMENT.md docs/DEMO.md docs/DESIGN.md \
              docs/API.md docs/DIAGRAMS.html; do
            test -s "$f" || (echo "hilang/kosong: $f" && exit 1)
          done
          grep -q "<svg" docs/DIAGRAMS.html || (echo "DIAGRAMS.html tanpa SVG" && exit 1)
          grep -q "docs/screenshots/01-landing-hero.png" README.md \
            || (echo "README tanpa screenshot landing" && exit 1)
          grep -q "docs/demo/demo.mp4" README.md \
            || (echo "README tanpa video demo" && exit 1)
          test -s docs/demo/demo.mp4 || (echo "video demo hilang" && exit 1)
          test -s public/preview-dashboard.png || (echo "preview dashboard hilang" && exit 1)
          echo "docs: semua berkas ada"
